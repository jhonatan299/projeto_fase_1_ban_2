spring:
  main:
    web-application-type: none
    banner-mode: "off"

  application:
    name: projeto_api_1

  datasource:
    url: jdbc:postgresql://localhost:5432/apostas_esportivas
    username: postgres
    password: 1234
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      idle-timeout: 30000

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        jdbc:
          lob:
            non_contextual_creation: true
